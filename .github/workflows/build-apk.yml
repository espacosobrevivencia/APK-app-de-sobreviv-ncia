name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'icone.png'
      - 'package.json'
      - 'capacitor.config.json'
      - 'prepare-web.mjs'
      - 'native-entry.js'
      - 'CentralBridgePlugin.java.txt'
      - 'patch-android.mjs'
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check signing secrets
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não está configurado."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Prepare signing key
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sobrevivencia-central-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sobrevivencia-central-release.jks" >> "$GITHUB_ENV"

      - name: Add native bridge and Android settings
        run: node patch-android.mjs

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK de release não encontrado."
            find android/app/build/outputs -maxdepth 5 -type f || true
            exit 1
          fi
          cp "$APK_PATH" dist/Sobrevivencia-Central-V4.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sobrevivencia-Central-V4.2.0
          path: dist/Sobrevivencia-Central-V4.2.0.apk
          if-no-files-found: error
