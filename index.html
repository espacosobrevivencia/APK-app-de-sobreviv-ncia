const EMERGENCIES = [
  {id:"inconsciente",category:"Saúde",icon:"🫁",title:"Pessoa inconsciente",summary:"Verifique resposta e respiração e acione o SAMU.",recognize:["Não responde quando chamada ou tocada com cuidado.","Pode estar respirando normalmente ou não."],steps:["Confirme primeiro que o local é seguro para você e para a vítima.","Tente obter resposta chamando a pessoa e tocando-a com cuidado.","Peça ajuda e ligue 192. Coloque o telefone no viva-voz e siga as orientações do atendente.","Observe se a pessoa respira normalmente.","Se não respirar normalmente, trate como possível parada cardiorrespiratória e siga imediatamente as orientações para RCP.","Se respirar, monitore continuamente. Se houver suspeita de trauma, evite movimentação desnecessária."],dont:["Não dê água, comida ou medicamentos.","Não deixe a pessoa sozinha se permanecer no local for seguro."],waiting:["Observe continuamente respiração e nível de consciência.","Mantenha a pessoa protegida do frio/calor enquanto aguarda ajuda."],calls:["192"]},
  {id:"pcr",category:"Saúde",icon:"❤️‍🩹",title:"Parada cardiorrespiratória / RCP",summary:"Não responde e não respira normalmente: cada minuto importa.",recognize:["Pessoa não responde.","Ausência de respiração normal ou apenas movimentos respiratórios anormais."],steps:["Garanta a segurança da cena.","Ligue 192 imediatamente e coloque o telefone no viva-voz.","Peça a alguém para buscar um DEA/desfibrilador, se houver um disponível.","Siga as instruções do médico regulador/atendente.","Se você sabe realizar RCP, inicie-a sem demora e continue conforme seu treinamento e as instruções recebidas.","Se houver DEA, use-o seguindo as instruções de voz do equipamento."],dont:["Não perca tempo procurando pulso se você não foi treinado para isso.","Não ofereça líquidos ou medicamentos."],waiting:["Alterne socorristas se houver outras pessoas treinadas e isso puder ser feito sem longas interrupções.","Continue até a vítima reagir, o socorro assumir ou o local se tornar inseguro."],calls:["192","193"]},
  {id:"engasgo",category:"Saúde",icon:"😮‍💨",title:"Engasgo",summary:"Dificuldade grave para falar, tossir ou respirar exige ação imediata.",recognize:["Tosse forte ainda movimenta ar: a obstrução pode ser parcial.","Não consegue falar, respirar ou tossir de forma eficaz: suspeite de obstrução grave."],steps:["Se a pessoa consegue tossir com força e respirar, incentive-a a continuar tossindo e observe.","Se não consegue respirar, falar ou tossir de forma eficaz, peça ajuda e acione 192.","Se você conhece a técnica adequada para a idade da pessoa, aplique a manobra para desobstrução conforme seu treinamento.","Se a pessoa perder a consciência, coloque o telefone no viva-voz e siga imediatamente as orientações para RCP."],dont:["Não faça varredura cega com os dedos dentro da boca.","Não dê água enquanto a obstrução estiver acontecendo."],waiting:["Mesmo após melhora, procure avaliação se persistirem tosse, dor, falta de ar ou suspeita de corpo estranho."],calls:["192"]},
  {id:"hemorragia",category:"Saúde",icon:"🩸",title:"Hemorragia intensa",summary:"Pressão direta firme e contínua é a prioridade.",recognize:["Sangramento volumoso, contínuo ou que encharca rapidamente tecidos.","Fraqueza, palidez, suor frio ou alteração de consciência podem indicar gravidade."],steps:["Garanta a segurança da cena e use luvas/barreira se estiver disponível.","Aplique pressão direta firme e contínua sobre o ferimento com gaze ou tecido limpo.","Se o material encharcar, mantenha a primeira camada e coloque mais material por cima sem interromper a pressão.","Em sangramento intenso, ligue 192 ou 193.","Mantenha a pessoa aquecida e observe respiração e consciência.","Torniquete pode ser indicado em hemorragia grave de membro, mas exige produto/técnica apropriados; use apenas se você tiver treinamento ou orientação profissional."],dont:["Não retire objetos profundamente encravados.","Não perca tempo limpando profundamente uma ferida antes de controlar o sangramento grave."],waiting:["Continue a pressão até o atendimento assumir.","Avise se a vítima ficar mais sonolenta, fria ou confusa."],calls:["192","193"]},
  {id:"infarto",category:"Saúde",icon:"❤️",title:"Suspeita de infarto",summary:"Dor/pressão no peito, suor frio ou falta de ar: acione o SAMU.",recognize:["Dor, pressão ou desconforto no peito de início súbito.","Suor frio, palidez, falta de ar ou sensação de desmaio.","Idosos e algumas pessoas podem ter sintomas menos típicos, como mal-estar súbito ou falta de ar."],steps:["Interrompa esforço e mantenha a pessoa em repouso numa posição confortável.","Ligue 192 imediatamente e informe os sintomas e o horário aproximado de início.","Afrouxe roupas apertadas e mantenha a pessoa calma.","Se ela perder a consciência e não respirar normalmente, passe para o protocolo de parada cardiorrespiratória."],dont:["Não deixe a pessoa dirigir até o hospital.","Não ofereça medicamentos por conta própria; siga prescrição já existente ou orientação profissional."],waiting:["Observe respiração e consciência.","Tenha documentos e lista de medicamentos disponíveis se isso não atrasar o socorro."],calls:["192"]},
  {id:"avc",category:"Saúde",icon:"🧠",title:"Suspeita de AVC",summary:"Fraqueza de um lado, fala alterada ou perda de equilíbrio exigem atendimento imediato.",recognize:["Fraqueza ou formigamento súbito de um lado do rosto/corpo.","Dificuldade súbita para falar ou compreender.","Alteração súbita de visão, equilíbrio, coordenação ou caminhada.","Dor de cabeça súbita e intensa sem causa aparente."],steps:["Ligue 192 imediatamente.","Anote o horário em que os sintomas começaram ou a última vez em que a pessoa foi vista normal.","Mantenha a pessoa em segurança e observe respiração e consciência.","Se houver vômito ou redução de consciência, siga as orientações do SAMU para posicionamento e proteção das vias aéreas."],dont:["Não espere os sintomas passarem para procurar ajuda.","Não ofereça comida, bebida ou medicamentos por conta própria."],waiting:["Tenha informações sobre início dos sintomas, medicamentos e doenças conhecidas prontas para a equipe."],calls:["192","193"]},
  {id:"convulsao",category:"Saúde",icon:"⚡",title:"Convulsão",summary:"Proteja de impactos, marque o tempo e não coloque nada na boca.",recognize:["Movimentos involuntários, perda de consciência ou rigidez.","Pode haver confusão e sonolência após a crise."],steps:["Afaste objetos perigosos e proteja a cabeça de impactos sem conter os movimentos à força.","Marque o horário de início da crise.","Afrouxe roupas apertadas ao redor do pescoço se isso puder ser feito com segurança.","Quando os movimentos terminarem, observe respiração e mantenha a pessoa protegida enquanto recupera a consciência.","Acione 192 especialmente em primeira crise, crise prolongada/repetida, trauma, gravidez, dificuldade respiratória ou recuperação incompleta."],dont:["Não segure a pessoa à força.","Não coloque objetos, dedos, líquidos ou medicamentos na boca durante a crise."],waiting:["Fique com a pessoa até ela recuperar orientação ou o socorro chegar.","Explique o que aconteceu de forma calma quando ela despertar."],calls:["192"]},
  {id:"desmaio",category:"Saúde",icon:"😵",title:"Desmaio",summary:"Avalie respiração e trate como emergência se a recuperação não for rápida.",recognize:["Perda breve de consciência com queda.","Pode haver tontura, suor frio ou visão escurecida antes."],steps:["Proteja a pessoa de quedas e confirme que está respirando normalmente.","Se não recuperar a consciência rapidamente, se houver trauma importante ou sintomas preocupantes, ligue 192.","Quando consciente, mantenha-a em repouso e observe se há dor no peito, falta de ar, fraqueza de um lado ou outros sinais graves."],dont:["Não force a pessoa a levantar imediatamente.","Não ofereça líquidos enquanto estiver sonolenta ou confusa."],waiting:["Se ela voltar a desmaiar ou piorar, trate como urgência e acione o SAMU."],calls:["192"]},
  {id:"choque",category:"Saúde",icon:"🫀",title:"Sinais de choque circulatório",summary:"Palidez, pele fria, fraqueza e confusão após doença ou trauma podem indicar gravidade.",recognize:["Pele pálida/fria, suor, fraqueza intensa, confusão ou sonolência.","Pode ocorrer após hemorragia, trauma, reação alérgica ou doença grave."],steps:["Ligue 192 em quadro importante ou que esteja piorando.","Trate a causa evidente quando for seguro, como controlar hemorragia externa.","Mantenha a pessoa aquecida e em repouso.","Observe respiração e consciência continuamente."],dont:["Não ofereça comida ou bebida a pessoa muito doente, confusa ou com possível necessidade de cirurgia.","Não deixe a pessoa caminhar se estiver fraca ou prestes a desmaiar."],waiting:["Informe ao atendimento qualquer sangramento, alergia, trauma ou doença que possa ter iniciado o quadro."],calls:["192","193"]},
  {id:"anafilaxia",category:"Saúde",icon:"🐝",title:"Reação alérgica grave / anafilaxia",summary:"Dificuldade para respirar, inchaço de língua/garganta ou desmaio são emergência.",recognize:["Dificuldade respiratória, chiado ou sensação de garganta fechando.","Inchaço de língua, lábios ou rosto.","Urticária disseminada associada a sintomas respiratórios, vômitos intensos ou desmaio."],steps:["Ligue 192 imediatamente.","Afaste o possível agente se isso puder ser feito com segurança.","Se a pessoa possui autoinjetor de adrenalina prescrito para ela e você sabe usá-lo, siga exatamente as instruções do dispositivo/prescrição.","Observe respiração e prepare-se para seguir instruções de RCP se houver perda de consciência e respiração anormal."],dont:["Não espere para ver se uma dificuldade respiratória importante melhora sozinha.","Não dê alimentos ou líquidos se houver dificuldade para engolir."],waiting:["Mantenha o autoinjetor/embalagens e informações sobre alergias disponíveis para a equipe."],calls:["192"]},
  {id:"insolacao",category:"Saúde",icon:"☀️",title:"Golpe de calor / insolação",summary:"Confusão, desmaio ou temperatura muito elevada exigem resfriamento e socorro.",recognize:["Confusão, comportamento anormal, desmaio ou convulsão em ambiente quente.","Pele muito quente e mal-estar intenso podem ocorrer."],steps:["Leve a pessoa para local fresco, sombreado e ventilado.","Remova excesso de roupas e inicie resfriamento com água fresca, compressas ou banho quando disponível.","Em confusão, desmaio, convulsão ou quadro grave, ligue 192.","Se estiver totalmente consciente e engolindo normalmente, ofereça água em pequenos volumes."],dont:["Não dê líquidos a pessoa inconsciente, muito confusa ou com dificuldade para engolir.","Não deixe a pessoa sozinha em quadro grave."],waiting:["Continue resfriando e observando respiração/consciência até o socorro chegar."],calls:["192"]},
  {id:"hipotermia",category:"Saúde",icon:"🥶",title:"Hipotermia",summary:"Frio intenso, tremores e alteração mental exigem aquecimento gradual.",recognize:["Tremores intensos, fala arrastada, lentidão, confusão ou sonolência em ambiente frio.","Em quadros graves os tremores podem diminuir apesar de a pessoa estar piorando."],steps:["Retire a pessoa do vento, chuva e contato com superfícies frias.","Remova roupas molhadas quando possível e substitua por camadas secas.","Aqueça de forma gradual com cobertores e isolamento do chão.","Acione 192 em alteração de consciência, respiração anormal, quadro intenso ou piora."],dont:["Não aplique calor extremo diretamente na pele.","Não massageie vigorosamente braços e pernas em quadro grave."],waiting:["Manipule a pessoa com cuidado e monitore respiração e consciência."],calls:["192"]},
  {id:"desidratacao",category:"Saúde",icon:"💧",title:"Desidratação",summary:"Reponha líquidos se a pessoa puder engolir e reconheça sinais de gravidade.",recognize:["Sede, boca seca, fraqueza, tontura e urina reduzida podem ocorrer.","Confusão, desmaio, incapacidade de beber ou piora rápida sugerem quadro grave."],steps:["Leve a pessoa para local fresco e reduza o esforço.","Se estiver consciente e engolindo normalmente, ofereça água em pequenos volumes frequentes.","Se houver solução de reidratação industrializada, siga exatamente as instruções da embalagem.","Procure atendimento em vômitos persistentes, incapacidade de beber, confusão, desmaio ou piora rápida."],dont:["Não force líquidos em pessoa inconsciente ou com dificuldade de engolir.","Não improvise concentrações de sais sem fonte confiável."],waiting:["Continue observando consciência, urina e capacidade de ingerir líquidos."],calls:["192"]},
  {id:"parto",category:"Saúde",icon:"🤰",title:"Trabalho de parto / emergência obstétrica",summary:"Em parto inesperado ou sinais de risco, acione o SAMU e siga a regulação.",recognize:["Contrações muito frequentes, sangramento importante, perda de consciência ou sensação de nascimento iminente.","Qualquer quadro em que mãe ou bebê pareçam em risco."],steps:["Ligue 192 e siga as orientações do médico regulador.","Mantenha a pessoa em local seguro, privado e aquecido.","Separe toalhas/panos limpos e mantenha mãos limpas.","Se o nascimento acontecer antes da chegada do socorro, não puxe o bebê nem o cordão; siga exatamente as orientações telefônicas."],dont:["Não tente acelerar o parto.","Não puxe o bebê, placenta ou cordão umbilical."],waiting:["Mantenha mãe e bebê aquecidos e observe respiração/consciência."],calls:["192"]},

  {id:"queimadura",category:"Trauma",icon:"🧯",title:"Queimadura",summary:"Interrompa a fonte de calor, resfrie e não use receitas caseiras.",recognize:["Vermelhidão, dor, bolhas ou pele esbranquiçada/escurecida.","Queimaduras elétricas, químicas ou extensas merecem atenção urgente."],steps:["Interrompa o contato com a fonte de calor sem se colocar em risco.","Resfrie a área com água corrente fria, em jato suave, por aproximadamente 10 minutos.","Retire anéis, relógios e itens apertados próximos se não estiverem aderidos à pele.","Proteja a área de forma limpa.","Procure atendimento urgente em queimadura extensa, profunda, elétrica, química ou em áreas críticas."],dont:["Não use gelo diretamente.","Não fure bolhas.","Não arranque roupas/tecidos grudados.","Não aplique manteiga, pasta de dente, pó de café ou outras receitas caseiras."],waiting:["Mantenha a pessoa aquecida no restante do corpo e observe sinais de piora."],calls:["192","193"]},
  {id:"transito",category:"Trauma",icon:"🚗",title:"Acidente de trânsito",summary:"Proteja a cena, acione socorro e evite movimentação desnecessária.",recognize:["Colisão, atropelamento ou queda com possível vítima.","Risco adicional de tráfego, combustível, fogo ou eletricidade."],steps:["Priorize sua segurança e sinalize o local sem se expor ao tráfego.","Ligue 192 ou 193 e informe localização, número de vítimas, consciência e riscos visíveis.","Não mova pessoa com suspeita de trauma, salvo perigo imediato.","Controle hemorragia externa intensa com pressão direta.","Observe respiração e consciência até a chegada do socorro."],dont:["Não retire capacete de motociclista sem necessidade imediata e treinamento.","Não ofereça comida, água ou medicamentos a vítima gravemente ferida."],waiting:["Informe se alguém está preso às ferragens ou se há combustível/risco de incêndio."],calls:["192","193","190"]},
  {id:"fratura",category:"Trauma",icon:"🦴",title:"Fratura / lesão de membro",summary:"Evite movimentar a área e procure atendimento em deformidade, dor intensa ou ferida aberta.",recognize:["Dor importante, inchaço, deformidade ou incapacidade de usar o membro.","Osso exposto ou sangramento tornam o quadro mais grave."],steps:["Mantenha a pessoa em repouso e evite movimentar a região lesionada.","Se houver sangramento, controle com pressão ao redor da ferida sem pressionar diretamente osso exposto.","Se você foi treinado para imobilização, mantenha a região na posição encontrada e verifique circulação distal.","Acione 192/193 em trauma grave, deformidade importante, ferida aberta, perda de sensibilidade ou múltiplas lesões."],dont:["Não tente alinhar ou empurrar osso para o lugar.","Não force a pessoa a apoiar peso no membro."],waiting:["Observe cor, temperatura e sensibilidade da extremidade."],calls:["192","193"]},
  {id:"coluna",category:"Trauma",icon:"🧍",title:"Suspeita de lesão na coluna",summary:"Após trauma importante, evite movimentação desnecessária.",recognize:["Dor no pescoço/costas após queda, mergulho ou colisão.","Formigamento, fraqueza ou perda de movimento após trauma."],steps:["Acione 192/193 em trauma importante ou sinais neurológicos.","Peça para a pessoa permanecer parada na posição encontrada, se o local for seguro.","Observe respiração e consciência.","Só mova a vítima se houver perigo imediato no local ou orientação do serviço de emergência."],dont:["Não sente, levante ou gire a pessoa sem necessidade.","Não tente 'testar' movimentos do pescoço ou coluna."],waiting:["Mantenha a cabeça e o pescoço o mais estáveis possível sem provocar movimentos forçados."],calls:["192","193"]},
  {id:"ferimento",category:"Trauma",icon:"🩹",title:"Corte / ferimento",summary:"Controle o sangramento primeiro e depois proteja a ferida.",recognize:["Corte superficial ou profundo, perfuração ou laceração.","Procure atendimento em ferida profunda, muito contaminada ou com perda de função."],steps:["Faça pressão direta se estiver sangrando.","Depois de controlar sangramento leve/moderado, lave cuidadosamente a área com água limpa.","Cubra com material limpo.","Procure avaliação se a ferida for profunda, causada por objeto sujo/mordida, tiver corpo estranho, perda de sensibilidade ou sangramento que não cessa."],dont:["Não retire objeto grande/profundamente encravado.","Não feche ferida profunda com improvisos."],waiting:["Observe sinais de sangramento recorrente e procure orientação sobre tétano quando indicado."],calls:["192"]},
  {id:"olho",category:"Trauma",icon:"👁️",title:"Ferimento no olho",summary:"Proteja o olho e evite manipular objetos encravados.",recognize:["Dor intensa, perda de visão, sangramento ou objeto no olho.","Exposição química exige ação imediata."],steps:["Em produto químico, inicie irrigação abundante com água limpa e procure atendimento urgente.","Em objeto encravado ou trauma penetrante, não tente remover; proteja sem pressionar e procure emergência.","Em perda súbita de visão ou trauma importante, busque atendimento imediatamente."],dont:["Não esfregue o olho.","Não pressione um olho com objeto encravado.","Não use colírios/neutralizantes improvisados em exposição química."],waiting:["Mantenha a pessoa calma e evite que manipule o olho lesionado."],calls:["192"]},
  {id:"afogamento",category:"Trauma",icon:"🌊",title:"Afogamento",summary:"Não vire uma segunda vítima: resgate seguro primeiro.",recognize:["Pessoa submersa, em dificuldade na água ou retirada sem respirar normalmente."],steps:["Não entre na água se o resgate colocar você em risco. Prefira alcançar ou lançar um objeto flutuante.","Acione 193 e/ou 192.","Depois de retirada da água, verifique resposta e respiração.","Se não respirar normalmente, siga as orientações para RCP e use DEA se disponível.","Mesmo após recuperação, dificuldade respiratória persistente exige avaliação."],dont:["Não faça manobras para 'tirar água do pulmão' atrasando a ventilação/RCP.","Não entre em correnteza ou água perigosa sem capacidade/equipamento de resgate."],waiting:["Mantenha a pessoa aquecida e observe respiração."],calls:["193","192"]},

  {id:"choque-eletrico",category:"Fogo e riscos",icon:"⚡",title:"Choque elétrico",summary:"Desligue a energia antes de tocar na vítima.",recognize:["Contato com fio, tomada, equipamento ou descarga elétrica.","Pode haver queimadura, arritmia, queda ou perda de consciência."],steps:["Não toque na vítima enquanto a fonte elétrica puder estar energizada.","Desligue a energia no disjuntor/tomada somente se puder fazer isso com segurança.","Acione 192/193 em choque importante, alta tensão, queimaduras, perda de consciência, dor no peito ou sintomas persistentes.","Após cortar a energia, avalie resposta e respiração e siga RCP se necessário."],dont:["Não use objeto molhado ou metálico para afastar fonte elétrica.","Não se aproxime de cabo de alta tensão caído."],waiting:["Mesmo queimaduras externas pequenas podem esconder lesões internas; procure avaliação após choque relevante."],calls:["192","193"]},
  {id:"incendio",category:"Fogo e riscos",icon:"🔥",title:"Incêndio em edificação",summary:"Saia primeiro; combater fogo é secundário.",recognize:["Fumaça, cheiro de queimado, chama ou alarme.","A fumaça pode tornar rotas intransitáveis rapidamente."],steps:["Avise pessoas próximas e inicie a saída imediatamente.","Use a rota segura mais próxima; em fumaça, permaneça mais baixo.","Feche portas ao sair se isso não atrasar a fuga.","Quando estiver em local seguro, ligue 193 e informe endereço e riscos.","Use extintor apenas em fogo pequeno, com treinamento e rota de saída livre."],dont:["Não retorne para buscar objetos.","Não use elevador.","Não entre em ambiente tomado por fumaça."],waiting:["Faça contagem das pessoas e informe aos bombeiros quem pode estar faltando."],calls:["193"]},
  {id:"fumaca",category:"Fogo e riscos",icon:"🌫️",title:"Fumaça / monóxido de carbono",summary:"Saia para ar fresco e não retorne ao ambiente suspeito.",recognize:["Dor de cabeça, tontura, náusea, fraqueza ou confusão em local com combustão.","Mais de uma pessoa no mesmo ambiente com sintomas semelhantes aumenta a suspeita."],steps:["Saia imediatamente para local com ar fresco sem se expor novamente.","Ligue 193 e 192 se houver sintomas.","Mantenha outras pessoas afastadas do ambiente até avaliação segura.","Se alguém estiver inconsciente em local contaminado, não entre sem equipamento de proteção/resgate."],dont:["Não use gerador, churrasqueira, carvão ou motor a combustão em ambiente fechado.","Não retorne ao local apenas porque o cheiro desapareceu."],waiting:["Observe respiração e consciência até a equipe chegar."],calls:["193","192"]},
  {id:"vazamento-gas",category:"Fogo e riscos",icon:"🛢️",title:"Vazamento de gás",summary:"Evite faíscas, ventile se seguro e saia do local.",recognize:["Cheiro característico de gás, som de vazamento ou alarme de detector.","Pode haver risco de incêndio/explosão e asfixia."],steps:["Não acione interruptores, tomadas ou aparelhos elétricos no ambiente suspeito.","Se puder fazer sem risco, interrompa a fonte de gás e abra portas/janelas manualmente.","Retire as pessoas do local.","Ligue para 193 e para a distribuidora/assistência responsável a partir de local seguro."],dont:["Não acenda chama, não fume e não provoque faíscas.","Não tente procurar vazamento com fósforo/isqueiro."],waiting:["Mantenha o local isolado até avaliação."],calls:["193"]},
  {id:"produto-quimico",category:"Fogo e riscos",icon:"🧪",title:"Acidente com produto químico",summary:"Afaste-se da fonte e siga orientações específicas do produto/serviço de emergência.",recognize:["Contato com pele/olhos, inalação ou derramamento de substância desconhecida/perigosa."],steps:["Priorize sua própria proteção e retire a pessoa da exposição apenas se isso for seguro.","Acione 192/193 em sintomas importantes ou produto perigoso/desconhecido.","Guarde o rótulo, embalagem ou nome do produto para informar ao atendimento.","Em contato com olhos/pele, siga as instruções de primeiros socorros do rótulo/FISPQ e orientação profissional; em muitos casos é indicada irrigação abundante.","Consulte o CIATox da sua região quando aplicável."],dont:["Não misture produtos tentando neutralizar a substância.","Não provoque vômito em ingestão sem orientação especializada."],waiting:["Afaste outras pessoas da área contaminada e evite levar produto para ambientes fechados."],calls:["192","193"]},
  {id:"explosao",category:"Fogo e riscos",icon:"💥",title:"Explosão",summary:"Afaste-se de riscos secundários e acione socorro.",recognize:["Explosão com fogo, fumaça, destroços, estrutura instável ou vítimas."],steps:["Afaste-se de fogo, fumaça, vazamentos e estruturas instáveis.","Ligue 193; acione 192 se houver feridos.","Não entre em área de destroços instáveis.","Em vítimas acessíveis sem risco, controle hemorragia importante e observe respiração."],dont:["Não retorne à área por objetos.","Não toque em artefatos, recipientes ou materiais suspeitos."],waiting:["Informe possibilidade de produtos químicos, gás ou pessoas presas."],calls:["193","192","190"]},

  {id:"enchente",category:"Clima e desastres",icon:"🌊",title:"Enchente / inundação",summary:"Vá para local seguro e não atravesse água de enchente.",recognize:["Água subindo rapidamente, vias alagadas, alertas de evacuação."],steps:["Vá para local alto e seguro se houver risco de subida da água.","Siga alertas e ordens da Defesa Civil.","Se for seguro, desligue energia antes que a água alcance instalações.","Evite contato com água de inundação; ela pode esconder correnteza, buracos, objetos e contaminação.","Use somente água/alimentos não contaminados."],dont:["Não atravesse alagamentos a pé ou de veículo sem necessidade e avaliação segura.","Não toque em equipamentos elétricos molhados ou cabos caídos."],waiting:["Não retorne a área interditada até liberação."],calls:["199","193"]},
  {id:"tempestade",category:"Clima e desastres",icon:"⛈️",title:"Tempestade severa",summary:"Procure abrigo resistente e afaste-se de janelas.",recognize:["Raios frequentes, vento forte, granizo ou alerta oficial."],steps:["Procure construção resistente e permaneça longe de janelas.","Recolha-se de áreas abertas e afaste-se de árvores isoladas, postes e estruturas metálicas durante raios.","Mantenha lanterna, calçado e celular acessíveis.","Siga alertas da Defesa Civil quando disponíveis."],dont:["Não permaneça em área aberta durante descargas elétricas.","Não se aproxime de fios ou estruturas danificadas."],waiting:["Espere a condição melhorar antes de sair para avaliar danos."],calls:["199","193"]},
  {id:"raio",category:"Clima e desastres",icon:"🌩️",title:"Raios",summary:"Abrigo fechado e resistente é a prioridade.",recognize:["Trovoadas próximas ou relâmpagos frequentes."],steps:["Entre em edificação resistente ou veículo fechado quando disponível.","Afaste-se de janelas, áreas abertas, árvores isoladas, cercas e estruturas metálicas.","Se uma pessoa for atingida, é seguro tocá-la; avalie resposta/respiração e acione 192/193."],dont:["Não se abrigue sob árvore isolada.","Não permaneça em água, praia, campo aberto ou topo exposto durante a tempestade."],waiting:["Permaneça protegido até a tempestade se afastar claramente."],calls:["192","193"]},
  {id:"deslizamento",category:"Clima e desastres",icon:"⛰️",title:"Deslizamento de terra",summary:"Afaste-se de encostas e siga imediatamente alertas de evacuação.",recognize:["Rachaduras novas, árvores/postes inclinando, sons de estalos/terra ou lama em movimento."],steps:["Saia da área de risco imediatamente se houver sinais ou alerta.","Vá para local estável e afastado da encosta/rota de lama.","Acione 199 ou 193 e informe o local.","Não retorne para buscar objetos."],dont:["Não atravesse massa de lama ou área ainda instável.","Não fique próximo à base de encostas após chuva intensa se houver sinais de movimentação."],waiting:["Mantenha distância porque novos deslizamentos podem ocorrer."],calls:["199","193"]},

function normalizeHomeSettings(value){
  const raw = value && typeof value === "object" && !Array.isArray(value) ? value : {};
  const validSections = new Set(HOME_SECTION_DEFS.map(item => item[0]));
  const validModules = new Set(MODULES.map(item => item[0]));

  const order = [];
  const sourceOrder = Array.isArray(raw.sectionOrder) ? raw.sectionOrder : DEFAULT_HOME_SETTINGS.sectionOrder;
  for(const id of sourceOrder){
    if(validSections.has(id) && !order.includes(id)) order.push(id);
  }
  for(const id of DEFAULT_HOME_SETTINGS.sectionOrder){
    if(!order.includes(id)) order.push(id);
  }

  const hidden = Array.isArray(raw.hiddenSections)
    ? [...new Set(raw.hiddenSections.filter(id => validSections.has(id)))]
    : [];

  const quick = [];
  const sourceQuick = Array.isArray(raw.quickAccess) ? raw.quickAccess : DEFAULT_HOME_SETTINGS.quickAccess;
  for(const id of sourceQuick){
    if(validModules.has(id) && !quick.includes(id)) quick.push(id);
  }

  return {sectionOrder:order, hiddenSections:hidden, quickAccess:quick};
}

function normalizeEmergencyQuick(value){

async function nativeOpenResource(item){

  if(isNativeApp()&&bridge){
    if(item.systemAction&&bridge.openSystemAction){try{const r=await bridge.openSystemAction({action:item.systemAction});if(r?.opened)return true}catch{}}

async function nativeCheckResource(item){
  if(!item)return {installed:null};
  if(item.internalView)return {installed:true};
  const bridge=nativeCentral().plugin;
  if(!isNativeApp()||!bridge?.isAppInstalled)return {installed:null};
  const packages=[item.packageName,item.altPackageName].filter(Boolean);
  if(!packages.length)return {installed:null};
  for(const packageName of packages){
    try{const r=await bridge.isAppInstalled({packageName});if(r?.installed)return {installed:true,packageName}}catch{}

function formatWhen(iso){if(!iso)return "";try{return new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(new Date(iso))}catch{return iso}}

function daysFromToday(date){if(!date)return null;const today=new Date();today.setHours(12,0,0,0);const target=new Date(date+"T12:00:00");return Math.ceil((target-today)/86400000)}
function inventoryStatus(item){
  item=item&&typeof item==="object"?item:{};
  const low=Number(item.minimum)>0&&Number(item.quantity)<=Number(item.minimum);
  const dd=daysFromToday(typeof item.expiry==="string"?item.expiry:"");
  const expired=dd!==null&&dd<0;
  const expiring=dd!==null&&dd>=0&&dd<=30;
  return {low,expired,expiring,dd};
}
function maintenanceStatus(item){
  item=item&&typeof item==="object"?item:{};
  const dd=daysFromToday(typeof item.due==="string"?item.due:"");
  return {due:dd!==null&&dd<=0,soon:dd!==null&&dd>0&&dd<=14,dd};
}
function getAttentionCount(){
  const inventory=getInventory().filter(i=>i&&typeof i==="object");
  const maintenance=getMaintenance().filter(i=>i&&typeof i==="object");
  return inventory.filter(i=>{const st=inventoryStatus(i);return st.low||st.expired||st.expiring}).length+
    maintenance.filter(i=>{const st=maintenanceStatus(i);return st.due||st.soon}).length;
}

function getSafeHomeSettings(){
  const fallback=normalizeHomeSettings(DEFAULT_HOME_SETTINGS);
  try{
    const raw=loadJSON(STORAGE.settings,{});
    if(!raw||typeof raw!=="object"||Array.isArray(raw))return fallback;
    return normalizeHomeSettings(raw.home);
  }catch(error){
    console.error("Configuração da Home inválida; usando padrão.",error);
    return fallback;
  }
}

function safeAttentionCount(){
  try{return getAttentionCount()}
  catch(error){console.error("Falha ao calcular avisos da Home",error);return 0}
}

function buildHomeHTML(home,attention){
  const normalized=normalizeHomeSettings(home);
  const hidden=new Set(normalized.hiddenSections);
  return normalized.sectionOrder
    .filter(id=>!hidden.has(id))
    .map(id=>{
      try{return homeSectionHTML(id,normalized,attention)}
      catch(error){
        console.error("Erro isolado no bloco da Home:",id,error);
        return "";
      }
    })
    .join("");
}

function renderHome(){
  const fallback=normalizeHomeSettings(DEFAULT_HOME_SETTINGS);
  const attention=safeAttentionCount();

  let home=getSafeHomeSettings();
  let html="";

  try{
    html=buildHomeHTML(home,attention);
  }catch(error){
    console.error("Falha na personalização da Home; usando padrão.",error);
    home=fallback;
    try{
      html=buildHomeHTML(fallback,attention);
    }catch(secondError){
      console.error("Falha também no layout padrão da Home.",secondError);
    }
  }

  if(!html){
    // Último fallback: elementos essenciais sem depender da configuração salva.
    html=`
      <div class="emergency-now">
        <div class="emergency-now-head"><span>NÚMEROS RÁPIDOS</span><small>1 toque</small></div>

function saveCentralResourceEdit(form){
  const data=new FormData(form),items=getSecondSpace(),item=items.find(x=>x.id===form.dataset.id);if(!item)return;
  item.name=String(data.get("name")||item.name).trim();
  item.icon=String(data.get("icon")||"📱").trim().slice(0,8)||"📱";
  item.category=String(data.get("category")||"Outro").trim()||"Outro";
  item.packageName=String(data.get("packageName")||"").trim();
  item.role=String(data.get("role")||"").trim();
  item.backupFor=String(data.get("backupFor")||"").trim();
  item.primary=data.get("primary")==="on";
  saveSecondSpace(items);
}

ca; relevo, horizonte, nuvens e condições locais alteram a luz útil real.</div></div></details>`}

function openLibraryDB(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window)){reject(new Error("IndexedDB não disponível"));return}const req=indexedDB.open(LIB_DB_NAME,LIB_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("items")){const store=db.createObjectStore("items",{keyPath:"id"});store.createIndex("sourceId","sourceId",{unique:false});store.createIndex("signature","signature",{unique:false})}if(!db.objectStoreNames.contains("sources"))db.createObjectStore("sources",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Falha ao abrir IndexedDB"))})}
async function libraryGet(store,key){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readonly"),req=tx.objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryGetAll(store){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readonly"),req=tx.objectStore(store).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryPut(store,value){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(value);tx.oncomplete=()=>{db.close();resolve(value)};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryPutMany(store,values){
  const list=Array.from(values||[]);
  for(let start=0;start<list.length;start+=LIBRARY_IDB_CHUNK){
    const chunk=list.slice(start,start+LIBRARY_IDB_CHUNK),db=await openLibraryDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite"),os=tx.objectStore(store);for(const value of chunk)os.put(value);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error("Falha ao gravar lote no IndexedDB"))};tx.onabort=()=>{db.close();reject(tx.error||new Error("Gravação cancelada no IndexedDB"))}});
  }
}
async function libraryDeleteMany(store,keys){
  const list=Array.from(keys||[]);
  for(let start=0;start<list.length;start+=LIBRARY_IDB_CHUNK){
    const chunk=list.slice(start,start+LIBRARY_IDB_CHUNK),db=await openLibraryDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite"),os=tx.objectStore(store);for(const key of chunk)os.delete(key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error("Falha ao remover lote do IndexedDB"))};tx.onabort=()=>{db.close();reject(tx.error||new Error("Remoção cancelada no IndexedDB"))}});
  }
}
async function libraryDelete(store,key){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryClearAll(){try{const db=await openLibraryDB();await new Promise((resolve,reject)=>{const tx=db.transaction(["items","sources"],"readwrite");tx.objectStore("items").clear();tx.objectStore("sources").clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch{}librarySessionFiles.clear();librarySourceCache.clear();cleanupLibraryThumbUrls();cleanupLibraryViewerUrls()}
async function libraryDbRoundTrip(){try{const test={id:"__library_test__",name:"test",addedAt:new Date().toISOString()};await libraryPut("items",test);const read=await libraryGet("items",test.id);await libraryDelete("items",test.id);return !!(read&&read.name==="test")}catch{return false}}
function cleanupLibraryThumbUrls(){if(libraryThumbObserver){try{libraryThumbObserver.disconnect()}catch{}libraryThumbObserver=null}for(const url of libraryThumbUrls)try{URL.revokeObjectURL(url)}catch{}libraryThumbUrls.clear()}

function libraryKind(file){const mime=String(file?.type||"").toLowerCase(),name=String(file?.name||"").toLowerCase();if(mime.startsWith("image/")||/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/.test(name))return "image";if(mime.startsWith("video/")||/\.(mp4|webm|mkv|mov|m4v|3gp|avi)$/.test(name))return "video";if(mime==="application/pdf"||name.endsWith(".pdf"))return "pdf";return "other"}
function libraryKindLabel(kind){return {image:"Foto",video:"Vídeo",pdf:"PDF",other:"Outro"}[kind]||"Outro"}
function libraryKindIcon(kind){return {image:"🖼️",video:"🎬",pdf:"📄",other:"📦"}[kind]||"📦"}
function formatBytes(bytes){const n=Number(bytes)||0;if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(n<10240?1:0)} KB`;if(n<1073741824)return `${(n/1048576).toFixed(n<10485760?1:0)} MB`;return `${(n/1073741824).toFixed(2)} GB`}
function formatDuration(sec){const n=Number(sec);if(!Number.isFinite(n)||n<=0)return "";const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=Math.round(n%60);return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}
function autoLibraryCategory(name,path=""){const t=normalizeText(`${name} ${path}`);const rules=[["Emergência",/emerg|sos|desastre|enchent|incendio|acidente/],["Água",/agua|hidrat|purifica|filtro|filtra/],["Primeiros socorros",/primeir|socorro|medic|ferid|hemorrag|queim|cobra|serpente|rcp|engasg|fratur/],["Abrigo",/abrigo|lona|barraca|shelter/],["Fogo",/fogo|fogareiro|ignicao|lenha|fire/],["Nós e cordas",/\bno\b|nos|corda|lais|prusik|amarra/],["Alimentação",/aliment|comida|cozinha|cozimento|food/],["Higiene",/higiene|saneamento|residuo|sanitari/],["Navegação",/naveg|mapa|gps|bussola|coordenad|azimut/],["Comunicação",/comunic|radio|meshtastic|morse|sinal/],["Energia",/energia|bateria|power.?bank|solar|carreg/]];for(const [cat,re] of rules)if(re.test(t))return cat;return "Geral"}

async function hydrateLibraryThumbnails(){if(currentViewName!=="biblioteca")return;const imgs=[...document.querySelectorAll("img[data-library-thumb]")];if(!imgs.length)return;const load=async img=>{const id=img.dataset.libraryThumb,item=await libraryGet("items",id);if(!item||Number(item.size)>LIBRARY_THUMB_MAX_BYTES)return;const file=await getLibraryFile(item,false);if(!file||!String(file.type||"").startsWith("image/"))return;const url=URL.createObjectURL(file);libraryThumbUrls.add(url);const release=()=>{if(libraryThumbUrls.has(url)){try{URL.revokeObjectURL(url)}catch{}libraryThumbUrls.delete(url)}};img.addEventListener("load",release,{once:true});img.addEventListener("error",release,{once:true});img.src=url;img.hidden=false;const ph=img.parentElement?.querySelector(".library-thumb-placeholder");if(ph)ph.hidden=true};if("IntersectionObserver" in window){libraryThumbObserver=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){libraryThumbObserver.unobserve(entry.target);load(entry.target)}},{rootMargin:"160px"});imgs.forEach(img=>libraryThumbObserver.observe(img))}else imgs.slice(0,20).forEach(load)}

  if(f.id==="homeQuickAddForm"){addQuickAccess(String(d.get("module")||""));renderHomeSettings();showToast("Acesso rápido adicionado");return}
  if(f.id==="checklistAddForm"){const a=getChecklist();a.push({id:uid("check"),text:String(d.get("text")).trim(),category:String(d.get("category")||"").trim(),done:false});saveJSON(STORAGE.checklist,a);renderChecklist();return}
  if(f.id==="contactAddForm"){const a=getContacts(),item={id:uid("contact"),name:String(d.get("name")).trim(),phone:String(d.get("phone")).trim(),note:String(d.get("note")||"").trim(),icon:String(d.get("icon")||"📞").trim().slice(0,4)||"📞",category:String(d.get("category")||"Pessoal").trim()||"Pessoal"};a.push(item);saveJSON(STORAGE.contacts,a);if(d.get("quick")==="on")addEmergencyQuick(`contact:${item.id}`);renderContacts();return}
  if(f.id==="emergencyNumberAddForm"){const a=getContacts(),item={id:uid("contact"),name:String(d.get("name")).trim(),phone:String(d.get("phone")).trim(),note:String(d.get("note")||"").trim(),icon:String(d.get("icon")||"📞").trim().slice(0,4)||"📞",category:String(d.get("category")||"Outro").trim()||"Outro"};a.push(item);saveJSON(STORAGE.contacts,a);if(d.get("quick")==="on")addEmergencyQuick(`contact:${item.id}`);renderEmergencyNumbers();showToast("Número salvo");return}
  if(f.id==="planForm"){saveJSON(STORAGE.plan,{meeting:String(d.get("meeting")||"").trim(),backupMeeting:String(d.get("backupMeeting")||"").trim(),radio:String(d.get("radio")||"").trim(),checkin:String(d.get("checkin")||"").trim(),backupMethod:String(d.get("backupMethod")||"").trim(),message:String(d.get("message")||"").trim(),notes:String(d.get("notes")||"").trim()});showToast("Plano salvo");return}
  if(f.id==="iceForm"){saveJSON(STORAGE.ice,Object.fromEntries([...d.entries()].map(([k,v])=>[k,String(v).trim()])));showToast("Ficha ICE salva");return}
  if(f.id==="journalForm"){const a=getJournal(),p=d.get("withLocation")?getLastPosition():null;a.push({id:uid("journal"),timestamp:new Date().toISOString(),type:String(d.get("type")),text:String(d.get("text")).trim(),position:p?{lat:p.lat,lon:p.lon}:null});saveJSON(STORAGE.journal,a);renderJournal();return}
  if(f.id==="inventoryForm"){const a=getInventory();a.push({id:uid("stock"),name:String(d.get("name")).trim(),category:String(d.get("category")||"").trim(),quantity:Number(d.get("quantity")),unit:String(d.get("unit")||"").trim(),minimum:Number(d.get("minimum")||0),expiry:String(d.get("expiry")||"")});saveJSON(STORAGE.inventory,a);renderInventory();return}
  if(f.id==="maintenanceForm"){const a=getMaintenance();a.push({id:uid("maint"),name:String(d.get("name")).trim(),due:String(d.get("due")),note:String(d.get("note")||"").trim()});saveJSON(STORAGE.maintenance,a);renderMaintenance();return}
  if(f.id==="resourceForm"){const a=getResources();a.push({id:uid("res"),type:String(d.get("type")),name:String(d.get("name")).trim(),reference:String(d.get("reference")||"").trim(),note:String(d.get("note")||"").trim()});saveJSON(STORAGE.resources,a);renderResources();return}
  if(f.id==="sosForm"){const text=`🆘 SOS\nPessoas: ${d.get("people")}\nFeridos: ${d.get("injured")}\nSituação: ${d.get("situation")}\nLocalização: ${d.get("coords")||"não informada"}\nNecessidade: ${d.get("need")||"ajuda"}\nPróximo contato: ${d.get("next")||"a definir"}`,r=document.getElementById("sosResult");r.hidden=false;r.innerHTML=`<div class="sos-output">${escapeHTML(text).replaceAll("\n","<br>")}</div><div class="btn-row"><button type="button" class="btn" data-copy="${escapeHTML(text)}">Copiar</button><button type="button" class="btn primary" data-share="${escapeHTML(text)}">Compartilhar</button></div>`;return}
  const handlers={mainWaterForm:()=>calculateWater(f,"mainWaterResult"),calcPlanWaterForm:()=>calculateWater(f,"calcPlanWaterResult"),waterReserveForm:()=>calculateWaterReserve(f,"waterReserveResult"),calcReserveForm:()=>calculateWaterReserve(f,"calcReserveResult"),energyBudgetForm:()=>calculateBudget(f,"energyBudgetResult"),calcBudgetForm:()=>calculateBudget(f,"calcBudgetResult"),energyRuntimeForm:()=>calculateRuntime(f,"energyRuntimeResult"),calcEnergyRuntimeForm:()=>calculateRuntime(f,"calcEnergyRuntimeResult"),energyPowerForm:()=>calculatePower(f,"energyPowerResult"),calcEnergyPowerForm:()=>calculatePower(f,"calcEnergyPowerResult"),navDistanceForm:()=>calculateDistance(f,"nav"),calcNavDistanceForm:()=>calculateDistance(f,"calcNav"),navDmsForm:()=>calculateDMS(f,"nav"),calcNavDmsForm:()=>calculateDMS(f,"calcNav"),navDecimalForm:()=>calculateDecimal(f,"nav"),calcNavDecimalForm:()=>calculateDecimal(f,"calcNav"),whForm:()=>calculateWh(f),travelForm:()=>calculateTravel(f),ropeForm:()=>calculateRope(f),unitForm:()=>calculateUnit(f),heatForm:()=>calculateHeat(f),windChillForm:()=>calculateWindChill(f),daylightForm:()=>calculateDaylight(f)};if(handlers[f.id])handlers[f.id]();
});
modal.addEventListener("click",e=>{if(e.target.closest("[data-close-modal]")){closeModal();return}const scenarioStep=e.target.closest("[data-scenario-kind]");if(scenarioStep){const kind=scenarioStep.dataset.scenarioKind,target=scenarioStep.dataset.scenarioTarget;closeModal();if(kind==="view")renderView(target);else if(kind==="emergency")showEmergency(target);else if(kind==="resource")nativeOpenResource(centralResourceInfo(target));else if(kind==="library")openLibraryQuery(target);return}const libShare=e.target.closest("[data-library-share]");if(libShare){shareLibraryItem(libShare.dataset.libraryShare);return}const libExternal=e.target.closest("[data-library-external]");if(libExternal){openLibraryExternal(libExternal.dataset.libraryExternal);return}if(e.target.closest("[data-library-modal-files]")){closeModal();addLibraryFiles();return}if(e.target.closest("[data-library-modal-folder]")){closeModal();addLibraryFolder();return}const fav=e.target.closest("[data-fav-type]");if(fav){e.stopPropagation();const type=fav.dataset.favType,id=fav.dataset.favId;toggleFavorite(type,id);if(type==="emergency")showEmergency(id);else{closeModal();renderView(id)}return}const share=e.target.closest("[data-share]");if(share){shareText(share.dataset.share);return}const copy=e.target.closest("[data-copy]");if(copy){copyText(copy.dataset.copy)}});
modal.addEventListener("submit",async e=>{const f=e.target;if(f.id!=="libraryEditForm")return;e.preventDefault();const item=await libraryGet("items",f.dataset.id);if(!item)return;const d=new FormData(f);item.category=LIBRARY_CATEGORIES.includes(String(d.get("category")))?String(d.get("category")):"Geral";item.tags=cleanLibraryTags(d.get("tags"));item.favorite=d.get("favorite")==="on";await libraryPut("items",item);closeModal();showToast("Organização salva");if(currentView()==="biblioteca")renderLibrary()});
modal.addEventListener("submit",e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==="centralResourceEditForm"){saveCentralResourceEdit(f);closeModal();renderCentral();showToast("Recurso atualizado");return}if(f.id==="checklistEditForm"){const a=getChecklist(),i=a.find(x=>x.id===f.dataset.id);if(i){i.text=String(d.get("text")).trim();i.category=String(d.get("category")||"").trim();saveJSON(STORAGE.checklist,a)}closeModal();renderChecklist()}if(f.id==="contactEditForm"){const a=getContacts(),i=a.find(x=>x.id===f.dataset.id);if(i){i.name=String(d.get("name")).trim();i.phone=String(d.get("phone")).trim();i.note=String(d.get("note")||"").trim();i.icon=String(d.get("icon")||"📞").trim().slice(0,4)||"📞";i.category=String(d.get("category")||"Pessoal").trim()||"Pessoal";saveJSON(STORAGE.contacts,a);const token=`contact:${i.id}`;d.get("quick")==="on"?addEmergencyQuick(token):removeEmergencyQuick(token)}closeModal();currentView()==="numeros"?renderEmergencyNumbers():renderContacts()}if(f.id==="inventoryEditForm"){const a=getInventory(),i=a.find(x=>x.id===f.dataset.id);if(i){i.name=String(d.get("name")).trim();i.quantity=Number(d.get("quantity"));i.unit=String(d.get("unit")||"").trim();i.minimum=Number(d.get("minimum")||0);i.expiry=String(d.get("expiry")||"");i.category=String(d.get("category")||"").trim();saveJSON(STORAGE.inventory,a)}closeModal();renderInventory()}if(f.id==="maintenanceEditForm"){const a=getMaintenance(),i=a.find(x=>x.id===f.dataset.id);if(i){i.name=String(d.get("name")).trim();i.due=String(d.get("due"));i.note=String(d.get("note")||"").trim();saveJSON(STORAGE.maintenance,a)}closeModal();renderMaintenance()}if(f.id==="resourceEditForm"){const a=getResources(),i=a.find(x=>x.id===f.dataset.id);if(i){i.type=String(d.get("type")).trim();i.name=String(d.get("name")).trim();i.reference=String(d.get("reference")||"").trim();i.note=String(d.get("note")||"").trim();saveJSON(STORAGE.resources,a)}closeModal();renderResources()}});

document.querySelector(".bottom-nav").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b)renderView(b.dataset.nav)});
document.getElementById("homeButton").addEventListener("click",()=>renderView("home"));
importInput.addEventListener("change",()=>{const f=importInput.files?.[0];if(f)importBackup(f)});
function currentView(){return currentViewName||"home"}
function updateConnection(){if(isNativeApp()){networkStatus.textContent=navigator.onLine?"● APK · online":"● APK · offline";networkStatus.className=navigator.onLine?"online":"offline";return}if(navigator.onLine){networkStatus.textContent=offlineReady?"● online · offline verificado":"● online · verificando cache";networkStatus.className="online"}else{networkStatus.textContent=offlineReady?"● offline · arquivos verificados":"● offline · não verificado";networkStatus.className="offline"}}
window.addEventListener("online",updateConnection);window.addEventListener("offline",updateConnection);window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();if(isNativeApp()){installPrompt=null;installButton.hidden=true;return}installPrompt=e;installButton.hidden=false});installButton.addEventListener("click",async()=>{if(isNativeApp()){installButton.hidden=true;return}if(!installPrompt){showToast("Use o menu do navegador para instalar");return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true});window.addEventListener("appinstalled",()=>{installPrompt=null;installButton.hidden=true;showToast("Aplicativo instalado")});
async function registerServiceWorker(){if(!("serviceWorker" in navigator)){offlineReady=false;updateConnection();return}let reloading=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});try{const reg=await navigator.serviceWorker.register("./service-worker.js",{scope:"./"});const offerUpdate=worker=>{if(!worker)return;const ask=()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller){if(confirm("Nova versão do Sobrevivência Offline foi armazenada com sucesso. Atualizar agora?"))worker.postMessage({type:"SKIP_WAITING"})}};if(worker.state==="installed")ask();else worker.addEventListener("statechange",ask)};if(reg.waiting)offerUpdate(reg.waiting);reg.addEventListener("updatefound",()=>offerUpdate(reg.installing));if(navigator.onLine)reg.update().catch(()=>{});await navigator.serviceWorker.ready;const st=await coreOfflineStatus();offlineReady=!!st.ready;updateConnection()}catch(e){offlineReady=false;updateConnection();console.error(e)}}
function initialView(){const v=new URLSearchParams(location.search).get("view");return v||"home"}
try{migrateData()}catch(error){console.error("Falha na migração de dados",error)}
try{applySettings()}catch(error){console.error("Falha ao aplicar configurações",error)}
if(isNativeApp())installButton.hidden=true;
try{updateConnection()}catch(error){console.error("Falha no status de conexão",error)}
try{renderView(initialView())}catch(error){
  console.error("Falha ao iniciar interface",error);
  view.innerHTML=`<div class="notice warning"><strong>Não foi possível montar a tela inicial.</strong><br>Os dados locais não foram apagados.</div><div class="btn-row"><button class="btn primary" data-action="repair-home-settings">Corrigir tela inicial</button><button class="btn" data-nav="mais">Todos os recursos</button></div>`;
}
if(isNativeApp()){offlineReady=true;updateConnection()}else{coreOfflineStatus().then(st=>{offlineReady=!!st.ready;updateConnection()}).catch(()=>{});registerServiceWorker()}

</script>
</body>
